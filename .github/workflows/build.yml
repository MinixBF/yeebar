name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash target/release/yeebar.exe -Algorithm SHA256).Hash.ToLower()
          "$h  yeebar.exe" | Out-File -Encoding ascii target/release/yeebar.exe.sha256
          Get-Content target/release/yeebar.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: yeebar
          path: |
            target/release/yeebar.exe
            target/release/yeebar.exe.sha256

  release:
    # A tag vX.Y.Z (equal to the version in Cargo.toml) publishes the exe as a GitHub release;
    # installed copies then offer the update from their menu.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v$v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: yeebar
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v t="## ${GITHUB_REF_NAME#v}" '$0 ~ "^## " {p = index($0, t) == 1; next} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/yeebar.exe dist/yeebar.exe.sha256 \
            --title "yeebar $GITHUB_REF_NAME" --notes "${notes:-Voir CHANGELOG.md}"
